<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>隱私權政策｜PetHub Taiwan</title><link rel="stylesheet" href="./styles.css"></head><body><main style="max-width:860px;margin:60px auto;padding:0 24px"><a href="./">← 回 PetHub</a><h1>隱私權政策</h1><p>更新日期：2026-08-16</p><p>PetHub Taiwan 目前提供地圖搜尋、定位、導航與收藏功能。定位資訊僅在使用者同意後由瀏覽器取得，用於顯示附近服務；目前版本不會將定位資料上傳至 PetHub 伺服器。收藏資料儲存在使用者瀏覽器的 localStorage。</p><h2>第三方服務</h2><p>地圖底圖使用 OpenStreetMap；導航可能連結至 Google Maps。第三方服務可能依其各自政策處理資料。</p><h2>未來功能</h2><p>若後續加入帳號、預約、付款、毛孩健康資料或店家管理功能，將在功能正式啟用前更新本政策與相關同意流程。</p></main></body></html>
